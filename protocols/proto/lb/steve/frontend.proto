/**
 * This protocol covers the client-side API to the Steve front-end. It
 * will be used by applications on different versions and for several
 * years, so it needs to be extremely simple and stable. No
 * incompatible changes are allowed on this protocol.
 */
package lb.steve.frontend;

option java_package = "com.logicblox.steve.protocol";

/**
 * Request/response unions
 */
message Request {
  optional CreateRequest create = 1;
  optional StateRequest state = 2;
  optional ResultRequest result = 3;
  optional KillRequest kill = 4;
}

message Response {

  optional string error = 1;
  optional string error_code = 2;

  optional CreateResponse create = 10;
  optional StateResponse state = 11;
  optional ResultResponse result = 12;
  optional KillResponse kill = 13;
}

/**
 * Create a new job
 */
message CreateRequest {
  // Identifier set by the client to make sure that a job is created
  // only once, even when there are networking issues. It turns a
  // create request into an idempotent operation of the job is created
  // more than once.
  required string client_id = 1;

  // Identifier of the job implementation.
  required string job_impl = 2;

  // Identifier used to correlate executions of jobs. The assumption
  // is that jobs executed with the same correlation id have similar
  // properties in terms of expected execution time.
  optional string correlation_id = 3;

  // Timeout for execution of job
  optional uint64 timeout = 4;

  // Parameters to be passed to the execution of the job
  repeated Param input_param = 10;

  // Input files (S3 urls)
  repeated File input = 11;

  // S3 url for output (prefix)
  required string output = 20;
  optional string output_encryption_key = 21;
}

message CreateResponse {
  required string job_id = 1;
}


/**
 * Request status of a job
 */
message StateRequest {
  required string job_id = 1;
  optional bool detail = 2;
}

message StateResponse {
  required string state = 1;
  repeated Status status = 2;
}

/**
 * Request result of a job execution
 */
message ResultRequest {
  required string job_id = 1;
}

message ResultResponse {
  repeated File output = 2;
}


/**
 * Kill a queued or executing job.
 */
message KillRequest {
  required string job_id = 1;
}

message KillResponse {
  // As a convenience to the client, we return the previous status of
  // the job (the new status will be pending-kill until the kill has
  // been handled)
  required string status = 1; 
}

/**
 * General
 */
message Param {
  required string key = 1;
  required string value = 2;
}

message File {
  required string url = 1;
  // TODO support SHA256/512 that we attach ourselves as metadata?
  optional string hash = 2;
}

message Status {
  required int64 timestamp = 1;
  required string status_code = 2;

  // TODO should we only return the machine under certain
  // authorization conditions?
  optional string machine = 3;

  optional string message = 4;
}
