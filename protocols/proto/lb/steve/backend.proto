/**
 * This protocol covers the messages sent to and from the Steve back-end.
 */
package lb.steve.backend;

option java_package = "com.logicblox.steve.protocol";

message RunJob {
  // Identifier of the job and job implementation.
  required string job_impl = 1;
  required string job = 2;

  // S3 urls for input
  repeated File input = 3;

  // S3 url for output (prefix)
  required string output = 4;

  // Timeout for the job
  optional int64 timeout = 5 [ default = 1800 ];

  // Metadata on the job.
  repeated Param metadata = 6;

  // Public key to encrypt the data
  optional string encryption_key = 7;

  // Account to which job belongs, needed to retrieve keys. Optional to keep compatible with older version of worker.
  optional string account = 8;
}

// TODO add timeout etc
enum StatusCode {
  STARTED = 0;
  SUCCEEDED = 1;
  FAILED = 2;
  PROGRESS = 3;
}

message JobStatus {
  // Identifier of the job.
  required string job = 1;

  // Timestamp of status update (milli-seconds)
  required int64 timestamp = 2;

  // Code of status change
  required StatusCode status_code = 3;

  // Machine that trigger the status update
  required string machine = 4;

  // If the status change is 'failed', then details on the failure
  // can be provided.
  optional FailedDetails failed_details = 10;

  // If the status change is 'succeeded', then output of the job
  // result can be provided.
  optional SucceededDetails succeeded_details = 11;

  // If the status change is 'progress', then details can be provided.
  optional ProgressDetails progress_details = 12;

  // When a job is finished, supply some resource usage
  optional ResourceUsage resource_usage = 13;
}

message FailedDetails {
  optional string error_code = 1;
  optional string error_message = 2;
}

message SucceededDetails {
  repeated File output = 1;
}

message ProgressDetails {
  required string message = 1;
}

message ResourceUsage {
  required int64 cpu_usage = 1;
  required int64 max_memory = 2;
  required int64 max_disk_usage = 3;
}

/**
 * General
 */
message File {
  required string url = 1;
  optional string hash = 2;
}

message Param {
  required string key = 1;
  required string value = 2;
}
